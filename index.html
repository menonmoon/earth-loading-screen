<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Earth</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Earth">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
  :root { --ink:#202122; --link:#3366cc; --border:#c8ccd1; --thumb-bg:#f8f9fa; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    background:#ffffff; color:var(--ink);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:100dvh; padding:24px 18px 84px;
    -webkit-tap-highlight-color:transparent;
    user-select:none; -webkit-user-select:none;
    cursor:pointer;
  }
  figure.thumb {
    border:1px solid var(--border); background:var(--thumb-bg);
    padding:4px; width:min(86vw, 342px);
    transition:opacity .35s ease;
  }
  figure.thumb.fading { opacity:0; }
  figure.thumb img.photo {
    display:block; width:100%; height:auto; max-height:46vh; object-fit:cover;
    border:1px solid var(--border); background:#eaecf0;
    transition:opacity .3s ease;
  }
  body.is-loading figure.thumb img.photo { opacity:.45; }
  figcaption {
    padding:5px 2px 1px; font-size:13.5px; line-height:1.45; color:var(--ink);
    overflow-wrap:break-word;
  }
  figcaption a { color:var(--link); text-decoration:none; }
  figcaption .magnify { float:right; margin:2px 0 0 6px; opacity:.55; }
  .loading-mark {
    position:fixed; left:16px; bottom:calc(14px + env(safe-area-inset-bottom));
    display:flex; align-items:center; gap:8px; z-index:5; pointer-events:none;
  }
  .loading-mark img { width:30px; height:30px; border-radius:50%; display:block; }
  .loading-mark span {
    font-family:"Linux Libertine", "Hoefler Text", Georgia, "Times New Roman", serif;
    font-style:italic; font-size:17px; color:var(--link);
  }
  body.is-loading .loading-mark span { animation:pulse .9s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.3; } }
  .credit {
    position:fixed; right:14px; bottom:calc(17px + env(safe-area-inset-bottom));
    font-size:10.5px; color:#72777d; z-index:5;
  }
  .credit a { color:#72777d; text-decoration:none; }
</style>
</head>
<body>
  <figure class="thumb" id="card">
    <img class="photo" id="photo" alt="">
    <figcaption id="caption"></figcaption>
  </figure>

  <div class="loading-mark" aria-hidden="true">
    <img src="globe.jpg" alt="">
    <span id="loadword">Loading…</span>
  </div>
  <div class="credit">Images &amp; captions · <a href="https://en.wikipedia.org/wiki/Earth">Wikipedia</a></div>

<script>
  var WORDS = ["Loading","Laden","Chargement","Cargando","Caricamento","Carregando","Загрузка","読み込み中","로딩 중","加载中","تحميل","Ładowanie"];
  var card = document.getElementById('card');
  var photo = document.getElementById('photo');
  var caption = document.getElementById('caption');
  var loadword = document.getElementById('loadword');
  var MAGNIFY = '<span class="magnify"><svg width="15" height="11" viewBox="0 0 15 11" fill="none" stroke="#54595d" stroke-width="1.2"><rect x="4" y="0.5" width="10.5" height="10"/><path d="M0.5 3.5 H4 M0.5 7.5 H4 M0.5 3.5 V7.5"/></svg></span>';
  var items = [], order = [], pos = 0, timer = null, wi = 0;

  function fixLinks(html) {
    return html
      .replace(/href="\/wiki\//g, 'href="https://en.wikipedia.org/wiki/')
      .replace(/href="\/w\//g, 'href="https://en.wikipedia.org/w/')
      .replace(/<a /g, '<a target="_blank" rel="noopener" ');
  }
  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function current() { return items[order[pos % order.length]]; }
  function upcoming() { return items[order[(pos + 1) % order.length]]; }
  function render(item) {
    photo.src = item.img;
    photo.alt = item.caption || '';
    caption.innerHTML = MAGNIFY + fixLinks(item.caption_html);
  }
  function preload(item) { var im = new Image(); im.src = item.img; }

  function advance() {
    if (!items.length) return;
    document.body.classList.add('is-loading');
    wi = (wi + 1) % WORDS.length;
    loadword.textContent = WORDS[wi] + '…';
    card.classList.add('fading');
    setTimeout(function () {
      pos++;
      if (pos % order.length === 0) { order = shuffle(order.slice()); pos = 0; }
      render(current());
      preload(upcoming());
      card.classList.remove('fading');
      setTimeout(function () { document.body.classList.remove('is-loading'); }, 350);
    }, 380);
    restart();
  }
  function restart() { clearInterval(timer); timer = setInterval(advance, 5200); }

  fetch('figures.json?rev=3').then(function (r) { return r.json(); }).then(function (data) {
    items = data;
    order = shuffle(items.map(function (_, i) { return i; }));
    var p = -1;
    for (var i = 0; i < items.length; i++) {
      if ((items[i].caption || '').indexOf('brown pelican') !== -1) { p = i; break; }
    }
    if (p > 0) { order = [p].concat(order.filter(function (x) { return x !== p; })); }
    render(current());
    preload(upcoming());
    restart();
  }).catch(function () {
    caption.textContent = 'Could not load images. Check your connection and tap to retry.';
  });

  document.body.addEventListener('click', function (e) {
    if (e.target.closest && e.target.closest('a')) return;
    advance();
  });
  if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }
</script>
</body>
</html>
